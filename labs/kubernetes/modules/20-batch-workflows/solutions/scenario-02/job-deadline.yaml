apiVersion: batch/v1
kind: Job
metadata:
  name: job-report
  namespace: lab
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: report
        image: busybox:1.36
        command: ["sh", "-c", "echo building report; sleep 60; echo done"]
        resources:
          requests: { cpu: 25m, memory: 16Mi }
          limits: { cpu: 100m, memory: 32Mi }
