apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-demo
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-demo
  template:
    metadata:
      labels:
        app: obs-demo
    spec:
      containers:
      - name: logger
        image: busybox:1.36
        command:
        - sh
        - -c
        - "while true; do\n  echo \"ts=$(date -Iseconds) level=info msg=heartbeat\"\
          \n  sleep 5\ndone\n"
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /definitely-missing
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 1
