apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-app
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latest-app
  template:
    metadata:
      labels:
        app: latest-app
    spec:
      containers:
      - name: web
        image: nginx:latest
        resources:
          requests: { cpu: 20m, memory: 32Mi }
          limits: { cpu: 100m, memory: 64Mi }
