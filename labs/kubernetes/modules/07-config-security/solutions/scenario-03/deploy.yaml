# Исправленная версия: образ, умеющий работать не от root (nginx-unprivileged,
# слушает 8080), и emptyDir-тома под то, что nginx обязан писать при старте.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hardened-web
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hardened-web
  template:
    metadata:
      labels:
        app: hardened-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - { name: cache, mountPath: /var/cache/nginx }
        - { name: run, mountPath: /tmp }
        resources:
          requests: { cpu: 20m, memory: 32Mi }
          limits: { cpu: 100m, memory: 64Mi }
      volumes:
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
