apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: broken-endpoints-route
  namespace: lab-gateway
spec:
  parentRefs:
  - name: demo-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /broken-path
    backendRefs:
    - name: missing-service
      port: 80
