apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-route
  namespace: lab-gateway
spec:
  parentRefs:
  - name: demo-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /beta
      headers:
      - name: X-Beta-Access
        type: Exact
        value: "true"
    backendRefs:
    - name: store-v1
      port: 80
