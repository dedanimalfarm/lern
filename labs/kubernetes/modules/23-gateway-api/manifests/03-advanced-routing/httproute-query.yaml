apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: query-route
  namespace: lab-gateway
spec:
  parentRefs:
  - name: demo-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /admin
      queryParams:
      - name: role
        type: Exact
        value: admin
    backendRefs:
    - name: store-v1
      port: 80
