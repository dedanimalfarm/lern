# Исправленная версия: том — PersistentVolumeClaim, он переживает под.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-data
  namespace: lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "запись $(date +%T) в /data/notes.log"
          echo "$(date +%T) заметка" >> /data/notes.log
          echo "строк в журнале: $(wc -l < /data/notes.log)"
          sleep 3600
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { cpu: 100m, memory: 32Mi }
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: notes-data
