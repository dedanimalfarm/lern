# Линт и самопроверка linux-basics — зеркало локальных scripts/qa/lint_text.py
# и lfcs-mock-exam/ci-selftest.sh.
#
# lint: текстовая гигиена, которую не видно глазами, но которая ломала задания на
# практике: CRLF (grep 'x$' переставал находить строки), файлы без \n в конце
# (wc -l недосчитывал строку), кириллические буквы в опциях (grep -С → invalid
# option) и в именах каталогов (первая «с» в 19.cut-and-paste была кириллической),
# смесь латиницы и кириллицы в одном слове; плюс shellcheck скриптов.
#
# mock-exam: пробный экзамен в одноразовых контейнерах Ubuntu 22.04 и 24.04.
# solutions — на нетронутом стенде verify.sh даёт 0 баллов, после эталонных решений 100;
# mistakes  — после типичных ошибок каждая задача с ловушкой получает FAIL.
#
# ls-certification: сертификация «Lord of the LiSts» (тема 1, 40 задач «одна задача —
# одна команда»). tests/selftest.sh: шаблон → 0 из 40, эталон → 40 из 40 и сертификат,
# каждая типичная ошибка → FAIL, равносильные записи → OK, check.sh не меняет арену.
# Гоняется от root и от обычного пользователя: студент сдаёт без root.
name: linux-basics-lint

on:
  push:
    branches: [main]
    paths:
      - 'labs/linux-basics/1.live-in-terminal/**'
      - 'labs/linux-basics/lfcs-mock-exam/**'
      - 'labs/linux-basics/scripts/qa/**'
      - '.github/workflows/linux-basics-lint.yml'
  pull_request:
    paths:
      - 'labs/linux-basics/1.live-in-terminal/**'
      - 'labs/linux-basics/lfcs-mock-exam/**'
      - 'labs/linux-basics/scripts/qa/**'
      - '.github/workflows/linux-basics-lint.yml'

defaults:
  run:
    working-directory: labs/linux-basics

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сначала доказываем, что линтер не «зелёный по умолчанию»:
      # каждое правило обязано сработать на своём примере дефекта.
      - name: Самопроверка линтера
        run: python3 scripts/qa/lint_text.py --self-test

      - name: Текстовый линт
        run: python3 scripts/qa/lint_text.py 1.live-in-terminal lfcs-mock-exam

      - name: shellcheck
        run: find lfcs-mock-exam 1.live-in-terminal -type f -name '*.sh' -print0 | xargs -0 shellcheck -x

  mock-exam:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
        mode: [solutions, mistakes]
    steps:
      - uses: actions/checkout@v4

      - name: ci-selftest.sh ${{ matrix.mode }} в ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/lfcs-mock-exam:/exam:ro" "${{ matrix.image }}" bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq sudo acl xz-utils >/dev/null
            /exam/ci-selftest.sh ${{ matrix.mode }}'

  ls-certification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@v4

      - name: selftest.sh в ${{ matrix.image }} — от root и от обычного пользователя
        run: |
          docker run --rm -v "$PWD/1.live-in-terminal/1.ls-and-history(wadd)/ls-certification:/cert:ro" \
            "${{ matrix.image }}" bash -c '
              set -e
              echo "### root";    /cert/tests/selftest.sh
              useradd -m -s /bin/bash student
              echo "### student"; su - student -c /cert/tests/selftest.sh'
