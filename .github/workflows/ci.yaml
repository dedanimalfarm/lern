name: Kubernetes Labs CI

# path-фильтр: kind-тест не должен гоняться (и краснеть) на
# коммитах в другие лабы репо (ansible/docker/linux).
on:
  push:
    branches: [ "main" ]
    paths:
      - 'labs/kubernetes/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'labs/kubernetes/**'
      - '.github/workflows/ci.yaml'

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint shellcheck
          wget https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform-linux-amd64.tar.gz

      - name: Run Linters (yamllint, kubeconform, shellcheck, kustomize)
        run: |
          cd labs/kubernetes
          bash scripts/qa/lint.sh

      - name: Check markdown links
        run: |
          cd labs/kubernetes
          bash check_links.sh

  kind-test:
    name: Test on Kind
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.23.0
          node_image: kindest/node:v1.30.0

      # helm нужен модулю 09 (lint/install/upgrade/rollback чарта demo-app);
      # без него его verify падает на need_bin.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Bootstrap lab namespaces and quotas
        # На свежем kind нет ns lab — без bootstrap каждый run-module падал
        # «namespaces "lab" not found» (исторический красный этого workflow).
        run: |
          cd labs/kubernetes
          export KUBECONFIG=~/.kube/config
          bash scripts/bootstrap/00-create-namespaces.sh
          bash scripts/bootstrap/01-apply-quotas.sh

      - name: Run automated sweep on kind
        run: |
          cd labs/kubernetes
          export KUBECONFIG=~/.kube/config
          # Прогоняем модули, которым хватает однонодового кластера без тяжёлых
          # аддонов стенда. Все перечисленные проверены на локальном k3s.
          # sweep.sh сам восстанавливает ns lab + quota/LimitRange перед каждым
          # модулем (clean-module в конце прогона сносит их вместе со всем в lab).
          #
          # Вне списка и почему:
          #   08, 11   — нужен metrics-server (11 ещё и ставит VPA через helm);
          #   15       — нужен CNI с enforcement NetworkPolicy (kindnet не режет);
          #   16,22,25 — sealed-secrets/ESO/VSO, ingress-nginx+cert-manager, Argo CD;
          #   17,18,30 — kube-prometheus-stack, Loki/Promtail, Tempo;
          #   19,21,23,24,28 — операторы (kopf/CNPG/Envoy Gateway/Argo Rollouts/HNC+vcluster);
          #   29       — требует Kubernetes >= 1.33 (native sidecars, in-place resize),
          #              а нода kind здесь 1.30 — prepare честно откажется;
          #   project-c/d/e — инциденты и аудиты поверх аддонов стенда.
          MODULES=(
            modules/01-kubectl-basics
            modules/02-pods-lifecycle
            modules/03-workloads
            modules/04-networking
            modules/05-storage
            modules/06-scheduling
            modules/07-config-security
            modules/09-helm-gitops
            modules/10-kubeadm-admin
            modules/12-resource-management
            modules/13-resilience
            modules/14-pod-security-admission
            modules/20-batch-workflows
            projects/project-a-platform-namespace
            projects/project-b-stateful-service
          )
          MODULE_TIMEOUT=420 REPORT_FILE=/tmp/qa-report.md \
            bash scripts/qa/sweep.sh "${MODULES[@]}"

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-qa-report
          path: /tmp/qa-report.md
          if-no-files-found: ignore
